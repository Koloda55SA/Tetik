<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 64" fill="none" role="img" aria-label="Tetik">
  <!--
    TETIK — Horizontal wordmark for DARK backgrounds
    Palette: #F0EFE9 (steel white) + #FF6B1A (brighter signal orange for dark bg)

    Same geometry as logo.svg, colors inverted for dark surface.
    T crossbar accent is brighter orange (#FF6B1A) for visibility on dark.
  -->

  <!-- ═══ T (first) — Wrench crossbar ═══ -->
  <rect x="20" y="6" width="68" height="14" rx="7" fill="#FF6B1A"/>
  <rect x="47" y="6" width="14" height="52" rx="2" fill="#F0EFE9"/>
  <rect x="47" y="6" width="14" height="14" fill="#FF6B1A"/>

  <!-- ═══ E (first) ═══ -->
  <rect x="100" y="6" width="12" height="52" rx="2" fill="#F0EFE9"/>
  <rect x="100" y="6" width="48" height="12" rx="2" fill="#F0EFE9"/>
  <rect x="100" y="27" width="36" height="10" rx="2" fill="#F0EFE9"/>
  <rect x="100" y="46" width="48" height="12" rx="2" fill="#F0EFE9"/>

  <!-- ═══ T (second) ═══ -->
  <rect x="160" y="6" width="52" height="12" rx="2" fill="#F0EFE9"/>
  <rect x="180" y="6" width="12" height="52" rx="2" fill="#F0EFE9"/>

  <!-- ═══ I ═══ -->
  <rect x="224" y="6" width="30" height="12" rx="2" fill="#F0EFE9"/>
  <rect x="234" y="6" width="10" height="52" rx="2" fill="#F0EFE9"/>
  <rect x="224" y="46" width="30" height="12" rx="2" fill="#F0EFE9"/>

  <!-- ═══ K ═══ -->
  <rect x="266" y="6" width="12" height="52" rx="2" fill="#F0EFE9"/>
  <polygon points="276,32 278,30 320,6 320,20 284,40" fill="#F0EFE9"/>
  <polygon points="278,34 284,40 320,58 316,58" fill="#F0EFE9"/>
</svg>
